<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>pi-omp-stats · AI Usage Dashboard</title>
<style>
  :root {
    --bg: #15151c; --panel: #1e1e28; --panel2: #242430; --border: #313142;
    --text: #e6e6ef; --muted: #8b8ba3; --accent: #7aa2f7; --green: #9ece6a;
    --red: #f7768e; --yellow: #e0af68; --orange: #ff9e64; --cyan: #7dcfff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  a { color: var(--accent); }
  header.topbar { display: flex; align-items: center; gap: 1rem; padding: 0.7rem 1.2rem; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  header.topbar h1 { font-size: 1rem; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
  header.topbar .sub { color: var(--muted); font-size: 0.78rem; }
  .spacer { flex: 1; }
  select, button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem 0.5rem; font-size: 0.82rem; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  nav.tabs { display: flex; gap: 0.2rem; padding: 0 1.2rem; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  nav.tabs button { border: none; background: transparent; color: var(--muted); padding: 0.55rem 0.8rem; border-bottom: 2px solid transparent; border-radius: 0; }
  nav.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  main { padding: 1.2rem; max-width: 1400px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.8rem; margin-bottom: 1.2rem; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem 1rem; }
  .card .label { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .card .value { font-size: 1.5rem; font-weight: 600; margin-top: 0.25rem; }
  .card .sub { color: var(--muted); font-size: 0.75rem; margin-top: 0.15rem; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-size: 0.82rem; }
  th, td { padding: 0.5rem 0.7rem; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.03em; background: var(--panel2); position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:hover td { background: var(--panel2); }
  .chart-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-bottom: 1.2rem; height: 300px; display: flex; flex-direction: column; }
  .chart-wrap.compact { height: 220px; }
  .chart-wrap h3 { margin: 0 0 0.6rem; font-size: 0.85rem; color: var(--muted); font-weight: 600; flex: 0 0 auto; }
  .chart-wrap canvas { flex: 1 1 auto; display: block; width: 100% !important; max-height: 100%; }
  .section-title { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 1.4rem 0 0.6rem; }
  .hidden { display: none !important; }
  .pill { display: inline-block; padding: 0.05rem 0.4rem; border-radius: 999px; font-size: 0.7rem; background: var(--panel2); border: 1px solid var(--border); color: var(--muted); }
  .err { color: var(--red); }
  .ok { color: var(--green); }
  #status { color: var(--muted); font-size: 0.78rem; min-height: 1rem; }
  .toast { position: fixed; bottom: 1rem; right: 1rem; background: var(--panel2); border: 1px solid var(--accent); padding: 0.5rem 0.8rem; border-radius: 8px; font-size: 0.8rem; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .empty { color: var(--muted); padding: 2rem; text-align: center; }
  code { background: var(--panel2); padding: 0.05rem 0.3rem; border-radius: 4px; font-size: 0.78rem; }
  .truncate { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<header class="topbar">
  <h1>pi-omp-stats</h1>
  <span class="sub" id="sessions-dir"></span>
  <div class="spacer"></div>
  <label class="sub">Range
    <select id="range">
      <option value="1h">1h</option>
      <option value="24h" selected>24h</option>
      <option value="7d">7d</option>
      <option value="30d">30d</option>
      <option value="90d">90d</option>
      <option value="all">All</option>
    </select>
  </label>
  <button id="sync-btn">↻ Sync</button>
  <span id="status"></span>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="overview" class="active">Overview</button>
  <button data-tab="models">Models</button>
  <button data-tab="folders">Folders</button>
  <button data-tab="tools">Tools</button>
  <button data-tab="behavior">Behavior</button>
  <button data-tab="costs">Costs</button>
  <button data-tab="providers">Providers</button>
  <button data-tab="requests">Requests</button>
  <button data-tab="errors">Errors</button>
</nav>

<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
/* Chart.js loader: try a local ./chart.min.js first (zero-CDN build), then
   fall back to the jsdelivr CDN. To go fully offline, drop a copy of
   Chart.js at dist/chart.min.js (or src/chart.min.js) next to the server. */
(function () {
  function ready() { window.dispatchEvent(new Event("chart-ready")); }
  var s = document.createElement("script");
  s.src = "./chart.min.js";
  s.onload = ready;
  s.onerror = function () {
    var c = document.createElement("script");
    c.src = "https://cdn.jsdelivr.net/npm/chart.js";
    c.onload = ready;
    c.onerror = ready; // proceed so tables still render without charts
    document.head.appendChild(c);
  };
  document.head.appendChild(s);
})();
</script>

<script>
const RANGES = { "1h": "1h", "24h": "24h", "7d": "7d", "30d": "30d", "90d": "90d", all: "all" };
let currentTab = "overview";
let stats = null;
let behavior = null, tools = null, providers = null, recent = null, errorsList = null;
let charts = {};
let chartReady = false;

const $ = (sel) => document.querySelector(sel);
const main = $("#main");
const statusEl = $("#status");

function fmtNum(n) { return new Intl.NumberFormat("en-US").format(Math.round(n || 0)); }
function fmtCost(n) { n = n || 0; if (n < 0.01) return "$" + n.toFixed(4); if (n < 1) return "$" + n.toFixed(3); return "$" + n.toFixed(2); }
function fmtPct(n) { if (!Number.isFinite(n)) return "0%"; return (n * 100).toFixed(1) + "%"; }
function fmtDur(ms) { if (ms == null || !Number.isFinite(ms)) return "-"; if (ms < 1000) return Math.round(ms) + "ms"; return (ms / 1000).toFixed(1) + "s"; }
function fmtDate(ms) { if (!ms) return "-"; return new Date(ms).toLocaleString(); }
function fmtDateShort(ms) { if (!ms) return "-"; return new Date(ms).toLocaleDateString([], { month: "short", day: "numeric" }) + " " + new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); }

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(path + " -> " + r.status);
  return r.json();
}

function range() { return $("#range").value; }

async function loadOverview() {
  stats = await api("/api/stats?range=" + range());
  renderOverview();
}

function card(label, value, sub) {
  return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
}

function renderOverview() {
  const o = stats.overall;
  const cards = `
    ${card("Requests", fmtNum(o.totalRequests), fmtNum(o.failedRequests) + " errors")}
    ${card("Total Cost", fmtCost(o.totalCost), fmtCost(o.totalCost / Math.max(1, o.totalRequests)) + " / req")}
    ${card("Cache Rate", fmtPct(o.cacheRate), fmtNum(o.totalCacheReadTokens) + " cached tok")}
    ${card("Cache Savings", fmtPct(o.cacheSavings), "vs uncached input")}
    ${card("Error Rate", fmtPct(o.errorRate), fmtNum(o.successfulRequests) + " ok")}
    ${card("Avg Latency", fmtDur(o.avgDuration), "duration")}
    ${card("Avg TTFT", fmtDur(o.avgTtft), "first token")}
    ${card("Tokens/s", o.avgTokensPerSecond != null ? o.avgTokensPerSecond.toFixed(1) : "-", "output rate")}
  `;
  main.innerHTML = cards + `
    <div class="chart-wrap"><h3>Requests & errors over time</h3><canvas id="ts-chart"></canvas></div>
    <div class="chart-wrap"><h3>Cost over time</h3><canvas id="cost-chart"></canvas></div>
    <div class="section-title">By agent type</div>
    <div id="agent-table"></div>
    <div class="section-title">Top models</div>
    <div id="top-models"></div>
    <div class="section-title">Top folders</div>
    <div id="top-folders"></div>
  `;
  renderAgentTable(stats.byAgentType);
  renderModelTable("#top-models", stats.byModel.slice(0, 8));
  renderFolderTable("#top-folders", stats.byFolder.slice(0, 8));
  drawTimeSeries(stats.timeSeries);
  drawCostSeries(stats.costSeries);
}

function renderAgentTable(rows) {
  if (!rows || rows.length === 0) { $("#agent-table").innerHTML = `<div class="empty">No data</div>`; return; }
  $("#agent-table").innerHTML = table(
    ["Agent", "Requests", "Input", "Output", "Cache R", "Cache W", "Cost"],
    rows.map(r => [r.agentType, fmtNum(r.totalRequests), fmtNum(r.totalInputTokens), fmtNum(r.totalOutputTokens), fmtNum(r.totalCacheReadTokens), fmtNum(r.totalCacheWriteTokens), fmtCost(r.totalCost)]),
    [0,1,2,3,4,5,6].map(i => i === 0 ? "" : "num")
  );
}

function table(headers, rows, numClasses) {
  const th = headers.map((h, i) => `<th class="${(numClasses && numClasses[i]) || ""}">${h}</th>`).join("");
  const trs = rows.map(r => `<tr>${r.map((c, i) => `<td class="${(numClasses && numClasses[i]) || ""}">${c}</td>`).join("")}</tr>`).join("");
  return `<table><thead><tr>${th}</tr></thead><tbody>${trs || `<tr><td colspan="${headers.length}" class="empty">No data</td></tr>`}</tbody></table>`;
}

function renderModelTable(sel, rows) {
  $(sel).innerHTML = table(
    ["Model", "Provider", "Reqs", "Errors", "Input", "Output", "Cache R", "Cache W", "Cache %", "Savings", "Cost", "Tok/s"],
    rows.map(m => [m.model, m.provider, fmtNum(m.totalRequests), fmtNum(m.failedRequests), fmtNum(m.totalInputTokens), fmtNum(m.totalOutputTokens), fmtNum(m.totalCacheReadTokens), fmtNum(m.totalCacheWriteTokens), fmtPct(m.cacheRate), fmtPct(m.cacheSavings), fmtCost(m.totalCost), m.avgTokensPerSecond != null ? m.avgTokensPerSecond.toFixed(1) : "-"]),
    ["", "", "num", "num", "num", "num", "num", "num", "num", "num", "num", "num"]
  );
}

function renderFolderTable(sel, rows) {
  $(sel).innerHTML = table(
    ["Folder", "Reqs", "Errors", "Input", "Output", "Cache R", "Cache W", "Cache %", "Cost"],
    rows.map(f => [`<span class="truncate" title="${f.folder}">${f.folder}</span>`, fmtNum(f.totalRequests), fmtNum(f.failedRequests), fmtNum(f.totalInputTokens), fmtNum(f.totalOutputTokens), fmtNum(f.totalCacheReadTokens), fmtNum(f.totalCacheWriteTokens), fmtPct(f.cacheRate), fmtCost(f.totalCost)]),
    ["", "num", "num", "num", "num", "num", "num", "num", "num"]
  );
}

function destroyCharts() { for (const k in charts) { try { charts[k].destroy(); } catch {} delete charts[k]; } }

function ensureChart(id) {
  const canvas = document.getElementById(id);
  if (!canvas) return null;
  if (charts[id]) { try { charts[id].destroy(); } catch {} }
  return canvas.getContext("2d");
}

function drawTimeSeries(points) {
  if (!chartReady || typeof Chart === "undefined" || !points || points.length === 0) return;
  const ctx = ensureChart("ts-chart");
  if (!ctx) return;
  const labels = points.map(p => fmtDateShort(p.timestamp));
  charts["ts-chart"] = new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: [
        { type: "bar", label: "Requests", data: points.map(p => p.requests), backgroundColor: "rgba(122,162,247,0.7)", yAxisID: "y" },
        { type: "line", label: "Errors", data: points.map(p => p.errors), borderColor: "#f7768e", backgroundColor: "rgba(247,118,142,0.2)", tension: 0.2, yAxisID: "y", pointRadius: 1.5 },
      ],
    },
    options: chartOpts({ y: "Requests", stacked: false }),
  });
}

function drawCostSeries(points) {
  if (!chartReady || typeof Chart === "undefined" || !points || points.length === 0) return;
  // sum cost per bucket across models
  const byBucket = new Map();
  for (const p of points) { byBucket.set(p.timestamp, (byBucket.get(p.timestamp) || 0) + p.cost); }
  const sorted = [...byBucket.entries()].sort((a, b) => a[0] - b[0]);
  const ctx = ensureChart("cost-chart");
  if (!ctx) return;
  charts["cost-chart"] = new Chart(ctx, {
    type: "line",
    data: { labels: sorted.map(s => fmtDateShort(s[0])), datasets: [{ label: "Cost ($)", data: sorted.map(s => s[1]), borderColor: "#9ece6a", backgroundColor: "rgba(158,206,106,0.2)", tension: 0.2, pointRadius: 1.5 }] },
    options: chartOpts({ y: "Cost ($)" }),
  });
}

function drawStackedArea(canvasId, series, valueKey, label) {
  if (!chartReady || typeof Chart === "undefined" || !series || series.length === 0) return;
  const buckets = [...new Set(series.map(p => p.timestamp))].sort((a, b) => a - b);
  const models = [...new Map(series.map(p => [p.model + "@" + p.provider, p.model])).values()];
  const byModel = new Map();
  for (const p of series) { const k = p.model; if (!byModel.has(k)) byModel.set(k, {}); byModel.get(k)[p.timestamp] = p[valueKey]; }
  const palette = ["#7aa2f7", "#9ece6a", "#e0af68", "#f7768e", "#bb9af7", "#7dcfff", "#ff9e64", "#73daca"];
  const datasets = models.map((m, i) => ({
    label: m, data: buckets.map(b => byModel.get(m)[b] || 0), backgroundColor: palette[i % palette.length] + "99", borderColor: palette[i % palette.length], fill: true, tension: 0.2, pointRadius: 1,
  }));
  const ctx = ensureChart(canvasId);
  if (!ctx) return;
  charts[canvasId] = new Chart(ctx, {
    type: "line",
    data: { labels: buckets.map(b => fmtDateShort(b)), datasets },
    options: chartOpts({ y: label, stacked: true }),
  });
}

function chartOpts(extra) {
  const o = {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { labels: { color: "#8b8ba3", boxWidth: 12 } } },
    scales: { x: { ticks: { color: "#8b8ba3", maxRotation: 0, autoSkip: true }, grid: { color: "rgba(255,255,255,0.05)" } }, y: { ticks: { color: "#8b8ba3" }, grid: { color: "rgba(255,255,255,0.05)" } } },
  };
  if (extra && extra.y) o.scales.y.title = { display: true, text: extra.y, color: "#8b8ba3" };
  if (extra && extra.stacked) { o.scales.x.stacked = true; o.scales.y.stacked = true; }
  return o;
}

async function renderTab(tab) {
  currentTab = tab;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  destroyCharts();
  statusEl.textContent = "";
  try {
    if (tab === "overview") { await loadOverview(); }
    else if (tab === "models") { if (!stats) stats = await api("/api/stats?range=" + range()); main.innerHTML = `<div class="chart-wrap"><h3>Requests by model over time</h3><canvas id="model-chart"></canvas></div><div class="section-title">Per model</div><div id="models-table"></div>`; renderModelTable("#models-table", stats.byModel); drawStackedArea("model-chart", stats.modelSeries, "requests", "Requests"); }
    else if (tab === "folders") { if (!stats) stats = await api("/api/stats?range=" + range()); main.innerHTML = `<div class="section-title">Per folder</div><div id="folders-table"></div>`; renderFolderTable("#folders-table", stats.byFolder); }
    else if (tab === "tools") { tools = await api("/api/stats/tools?range=" + range()); main.innerHTML = `<div class="chart-wrap"><h3>Tool calls over time</h3><canvas id="tools-chart"></canvas></div><div class="section-title">Per tool</div><div id="tools-table"></div>`; renderToolsTable(tools.byTool); drawStackedArea("tools-chart", tools.series, "calls", "Calls"); }
    else if (tab === "behavior") { behavior = await api("/api/stats/behavior?range=" + range()); renderBehavior(); }
    else if (tab === "costs") { const c = await api("/api/stats/costs?range=" + range()); main.innerHTML = `<div class="chart-wrap"><h3>Cost over time (by model)</h3><canvas id="costs-chart"></canvas></div>`; drawCostByModel(c.costSeries); }
    else if (tab === "providers") { providers = await api("/api/stats/providers?range=" + range()); renderProviders(); }
    else if (tab === "requests") { recent = await api("/api/stats/recent?limit=100"); renderRecent(recent, false); }
    else if (tab === "errors") { errorsList = await api("/api/stats/errors?range=" + range() + "&limit=100"); renderRecent(errorsList, true); }
  } catch (e) { main.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

function renderToolsTable(rows) {
  main.querySelector("#tools-table").innerHTML = table(
    ["Tool", "Calls", "Errors", "Args chars", "Result chars", "Tok share", "Cost share", "Last used"],
    rows.map(t => [t.tool, fmtNum(t.calls), fmtNum(t.errors), fmtNum(t.argsChars), fmtNum(t.resultChars), fmtNum(t.totalTokensShare), fmtCost(t.costShare), fmtDate(t.lastUsed)]),
    ["", "num", "num", "num", "num", "num", "num", "num"]
  );
}

function renderBehavior() {
  const o = behavior.overall;
  const cards = `
    ${card("User Messages", fmtNum(o.totalMessages), fmtNum(o.totalChars) + " chars")}
    ${card("Yelling", fmtNum(o.totalYelling), "sentences")}
    ${card("Profanity", fmtNum(o.totalProfanity), "hits")}
    ${card("Anguish", fmtNum(o.totalAnguish), "signals")}
    ${card("Negation", fmtNum(o.totalNegation), "corrections")}
    ${card("Repetition", fmtNum(o.totalRepetition), "repeats")}
    ${card("Blame", fmtNum(o.totalBlame), "reproaches")}
  `;
  main.innerHTML = cards + `<div class="section-title">By responding model</div><div id="behavior-table"></div>`;
  main.querySelector("#behavior-table").innerHTML = table(
    ["Model", "Provider", "Messages", "Yelling", "Profanity", "Anguish", "Negation", "Repetition", "Blame", "Chars"],
    behavior.byModel.map(m => [m.model === "unknown" ? "— no reply —" : m.model, m.provider, fmtNum(m.totalMessages), fmtNum(m.totalYelling), fmtNum(m.totalProfanity), fmtNum(m.totalAnguish), fmtNum(m.totalNegation), fmtNum(m.totalRepetition), fmtNum(m.totalBlame), fmtNum(m.totalChars)]),
    ["", "", "num", "num", "num", "num", "num", "num", "num", "num"]
  );
}

function drawCostByModel(points) {
  if (!chartReady || typeof Chart === "undefined" || !points || points.length === 0) return;
  const buckets = [...new Set(points.map(p => p.timestamp))].sort((a, b) => a - b);
  const models = [...new Set(points.map(p => p.model))];
  const palette = ["#7aa2f7", "#9ece6a", "#e0af68", "#f7768e", "#bb9af7", "#7dcfff", "#ff9e64", "#73daca"];
  const datasets = models.map((m, i) => ({
    label: m, data: buckets.map(b => points.filter(p => p.timestamp === b && p.model === m).reduce((s, p) => s + p.cost, 0)), backgroundColor: palette[i % palette.length] + "99", borderColor: palette[i % palette.length], stack: "cost",
  }));
  const ctx = ensureChart("costs-chart");
  if (!ctx) return;
  charts["costs-chart"] = new Chart(ctx, { type: "bar", data: { labels: buckets.map(b => fmtDateShort(b)), datasets }, options: chartOpts({ y: "Cost ($)", stacked: true }) });
}

function renderProviders() {
  main.innerHTML = `<div class="section-title">By provider</div><div id="providers-table"></div><div class="section-title">Peak burn hours (local)</div><div id="hourly-table"></div>`;
  main.querySelector("#providers-table").innerHTML = table(
    ["Provider", "Reqs", "Errors", "Models", "Input", "Output", "Cache R", "Cache W", "Total tok", "Cost", "Tok/s"],
    providers.providers.map(p => [p.provider, fmtNum(p.totalRequests), fmtNum(p.failedRequests), fmtNum(p.models), fmtNum(p.totalInputTokens), fmtNum(p.totalOutputTokens), fmtNum(p.totalCacheReadTokens), fmtNum(p.totalCacheWriteTokens), fmtNum(p.totalTokens), fmtCost(p.totalCost), p.avgTokensPerSecond != null ? p.avgTokensPerSecond.toFixed(1) : "-"]),
    ["", "num", "num", "num", "num", "num", "num", "num", "num", "num", "num"]
  );
  main.querySelector("#hourly-table").innerHTML = table(
    ["Provider", "Hour", "Total tok", "Output tok", "Reqs"],
    providers.hourly.map(h => [h.provider, h.hour + ":00", fmtNum(h.totalTokens), fmtNum(h.outputTokens), fmtNum(h.requests)]),
    ["", "num", "num", "num", "num"]
  );
}

function renderRecent(rows, isErrors) {
  main.innerHTML = `<div class="section-title">${isErrors ? "Recent errors" : "Recent requests"} (${rows.length})</div><div id="recent-table"></div>`;
  main.querySelector("#recent-table").innerHTML = table(
    ["When", "Model", "Provider", "Folder", "Stop", "In", "Out", "Cache R", "Cost", "Dur", "TTFT"],
    rows.map(r => [fmtDate(r.timestamp), r.model, r.provider, `<span class="truncate" title="${r.folder}">${r.folder}</span>`, r.stopReason, fmtNum(r.usage.input), fmtNum(r.usage.output), fmtNum(r.usage.cacheRead), fmtCost(r.usage.cost.total), fmtDur(r.duration), fmtDur(r.ttft)]),
    ["", "", "", "", "", "num", "num", "num", "num", "num", "num"]
  );
}

async function refreshAll() {
  statusEl.textContent = "Loading…";
  try {
    await renderTab(currentTab);
    statusEl.textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) { statusEl.textContent = "Error: " + e.message; }
}

async function doSync() {
  $("#sync-btn").disabled = true;
  statusEl.textContent = "Syncing…";
  try {
    const r = await fetch("/api/sync", { method: "POST" });
    const j = await r.json();
    statusEl.textContent = `Synced ${j.processed} new (${j.files} files, ${j.totalMessages} total)`;
    toast("Synced " + j.processed + " new entries");
    stats = null; behavior = null; tools = null; providers = null; recent = null; errorsList = null;
    await renderTab(currentTab);
  } catch (e) { statusEl.textContent = "Sync error: " + e.message; }
  finally { $("#sync-btn").disabled = false; }
}

document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => renderTab(b.dataset.tab)));
$("#range").addEventListener("change", () => { stats = null; behavior = null; tools = null; providers = null; errorsList = null; refreshAll(); });
$("#sync-btn").addEventListener("click", doSync);

window.addEventListener("chart-ready", () => { chartReady = true; refreshAll(); });
// If chart-ready already fired (script cached) or fails, still render.
setTimeout(() => { if (!chartReady) { chartReady = false; refreshAll(); } }, 1500);

(async function init() {
  try {
    const j = await api("/api/stats?range=all");
    $("#sessions-dir").textContent = " · " + (j.byFolder.length + " folders");
  } catch {}
})();
</script>
</body>
</html>
