<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pi-omp-stats · AI Usage Dashboard</title>
    <script>
      /* Anti-flash: apply the persisted theme before first paint. */
      (function () {
        try {
          var t = localStorage.getItem("pi-omp-stats-theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <style>
      :root[data-theme="dark"] {
        --base: #1e1e2e;
        --mantle: #181825;
        --crust: #11111b;
        --surface0: #313244;
        --surface1: #45475a;
        --surface2: #585b70;
        --overlay0: #6c7086;
        --overlay1: #7f849c;
        --text: #cdd6f4;
        --subtext1: #bac2de;
        --subtext0: #a6adc8;
        --muted: #9399b2;
        --dim: #6c7086;
        --border: rgba(255, 255, 255, 0.07);
        --border-strong: rgba(255, 255, 255, 0.12);
        --accent: #89b4fa;
        --accent-soft: rgba(137, 180, 250, 0.14);
        --green: #a6e3a1;
        --red: #f38ba8;
        --yellow: #f9e2af;
        --peach: #fab387;
        --teal: #94e2d5;
        --mauve: #cba6f7;
        --pink: #f5c2e7;
        --sky: #89dceb;
        --blue: #89b4fa;
        --lavender: #b4befe;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.35), 0 4px 14px rgba(0, 0, 0, 0.25);
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --base: #eff1f5;
        --mantle: #e6e9ef;
        --crust: #dce0e8;
        --surface0: #ccd0da;
        --surface1: #bcc0cc;
        --surface2: #acb0be;
        --overlay0: #9ca0b0;
        --overlay1: #8c8fa1;
        --text: #4c4f69;
        --subtext1: #5c5f77;
        --subtext0: #6c6f85;
        --muted: #7c7f93;
        --dim: #8c8fa1;
        --border: rgba(0, 0, 0, 0.08);
        --border-strong: rgba(0, 0, 0, 0.14);
        --accent: #1e66f5;
        --accent-soft: rgba(30, 102, 245, 0.1);
        --green: #40a02b;
        --red: #d20f39;
        --yellow: #df8e1d;
        --peach: #fe640b;
        --teal: #179299;
        --mauve: #8839ef;
        --pink: #ea76cb;
        --sky: #04a5e5;
        --blue: #1e66f5;
        --lavender: #7287fd;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 4px 14px rgba(0, 0, 0, 0.05);
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: var(--base);
        color: var(--text);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .app {
        display: grid;
        grid-template-columns: 216px minmax(0, 1fr);
        height: 100vh;
      }

      /* ---------------- Sidebar ---------------- */
      .sidebar {
        background: var(--mantle);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        user-select: none;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 18px 16px 14px;
        border-bottom: 1px solid var(--border);
      }
      .brand .dot {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--mauve), var(--blue));
        display: grid;
        place-items: center;
        font-weight: 700;
        color: #fff;
        font-size: 14px;
        box-shadow: var(--shadow);
      }
      .brand .name {
        font-weight: 700;
        letter-spacing: 0.01em;
        font-size: 15px;
      }
      .brand .sub {
        color: var(--muted);
        font-size: 12px;
      }
      .nav {
        padding: 10px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }
      .nav-label {
        color: var(--dim);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        padding: 12px 10px 5px;
      }
      .nav button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        text-align: left;
        background: transparent;
        border: none;
        color: var(--subtext0);
        cursor: pointer;
        padding: 9px 12px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
      }
      .nav button:hover {
        background: var(--surface0);
        color: var(--text);
      }
      .nav button.active {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .nav button svg {
        width: 15px;
        height: 15px;
        flex: 0 0 15px;
        opacity: 0.85;
      }
      .sidebar-footer {
        padding: 14px 16px;
        border-top: 1px solid var(--border);
        color: var(--dim);
        font-size: 12px;
        line-height: 1.5;
      }
      .sidebar-footer code {
        font-size: 10px;
      }

      /* ---------------- Top bar ---------------- */
      .main {
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 22px;
        background: color-mix(in srgb, var(--base) 82%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }
      .topbar h1 {
        font-size: 20px;
        margin: 0;
        font-weight: 650;
        letter-spacing: 0.01em;
      }
      .topbar .updated {
        color: var(--muted);
        font-size: 13px;
      }
      .spacer {
        flex: 1;
      }
      .seg {
        display: flex;
        background: var(--surface0);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 2px;
        gap: 2px;
      }
      .seg button {
        background: transparent;
        border: none;
        color: var(--muted);
        padding: 6px 13px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .seg button:hover {
        color: var(--text);
      }
      .seg button.active {
        background: var(--surface2);
        color: var(--text);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--surface0);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 15px;
        font-size: 13px;
        font-weight: 550;
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .btn svg {
        width: 14px;
        height: 14px;
      }
      .icon-btn {
        background: var(--surface0);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 8px;
        cursor: pointer;
        color: var(--subtext0);
        display: grid;
        place-items: center;
      }
      .icon-btn:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      .icon-btn svg {
        width: 16px;
        height: 16px;
      }
      #status {
        color: var(--muted);
        font-size: 13px;
        min-width: 60px;
      }

      /* ---------------- Content ---------------- */
      .content {
        padding: 20px 22px 40px;
        max-width: 1500px;
        width: 100%;
        margin: 0 auto;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }
      .card {
        background: var(--mantle);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        position: relative;
        overflow: hidden;
        transition: border-color 0.15s;
      }
      .card:hover {
        border-color: var(--border-strong);
      }
      .card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: var(--card-accent, var(--accent));
      }
      .card .label {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 600;
      }
      .card .value {
        font-size: 30px;
        font-weight: 700;
        margin-top: 5px;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
      }
      .card .sub {
        color: var(--dim);
        font-size: 12px;
        margin-top: 3px;
        font-variant-numeric: tabular-nums;
      }

      .panel {
        background: var(--mantle);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 18px;
      }
      .panel-head {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .panel-head h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
      }
      .panel-head .hint {
        color: var(--dim);
        font-size: 12px;
      }
      .panel-body {
        padding: 14px 16px;
      }

      .chart-wrap {
        background: var(--mantle);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 16px 10px;
        margin-bottom: 18px;
        height: 300px;
        display: flex;
        flex-direction: column;
      }
      .chart-wrap.tall {
        height: 360px;
      }
      .chart-wrap h3 {
        margin: 0 0 10px;
        font-size: 15px;
        color: var(--text);
        font-weight: 650;
      }
      .chart-wrap .chart-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        flex: 0 0 auto;
      }
      .chart-wrap .chart-head h3 {
        margin: 0;
      }
      .chart-wrap canvas {
        flex: 1 1 auto;
        display: block;
        width: 100% !important;
        max-height: 100%;
        min-height: 0;
      }
      .seg-sm {
        padding: 2px;
      }
      .seg-sm button {
        padding: 3px 10px;
        font-size: 12px;
      }

      .section-title {
        color: var(--muted);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        margin: 24px 0 12px;
        font-weight: 650;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--mantle);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        font-size: 14px;
      }
      th,
      td {
        padding: 10px 16px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      th {
        color: var(--muted);
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: var(--crust);
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      tbody tr:hover td {
        background: var(--surface0);
      }
      td.num,
      th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      td.model,
      td.folder {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 13px;
      }
      td.folder {
        color: var(--subtext0);
      }
      .truncate {
        max-width: 300px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .stop-stop,
      .stop-toolUse {
        color: var(--green);
      }
      .stop-error {
        color: var(--red);
      }
      .stop-aborted {
        color: var(--yellow);
      }
      .empty {
        color: var(--dim);
        padding: 30px;
        text-align: center;
      }
      code {
        background: var(--surface0);
        padding: 2px 7px;
        border-radius: 5px;
        font-size: 12px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }

      /* Folder tree (du/tree-style hierarchical view) */
      table.folder-tree td.folder {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 13px;
        white-space: nowrap;
      }
      table.folder-tree .tree-pre {
        color: var(--dim);
        user-select: none;
      }
      table.folder-tree tr.tree-branch td {
        background: var(--crust);
      }
      table.folder-tree tr.tree-branch .tree-name {
        color: var(--subtext1);
        font-weight: 600;
      }
      table.folder-tree tr.tree-branch td.num {
        color: var(--subtext0);
        font-weight: 600;
      }
      table.folder-tree tr.tree-leaf .tree-name {
        color: var(--text);
      }

      .toast {
        position: fixed;
        bottom: 18px;
        right: 18px;
        background: var(--surface0);
        border: 1px solid var(--accent);
        color: var(--text);
        padding: 11px 17px;
        border-radius: 10px;
        font-size: 14px;
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.2s,
          transform 0.2s;
        pointer-events: none;
        z-index: 50;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 920px) {
        .app {
          grid-template-columns: 1fr;
        }
        .sidebar {
          flex-direction: row;
          align-items: center;
          overflow-x: auto;
          border-right: none;
          border-bottom: 1px solid var(--border);
        }
        .brand {
          border-bottom: none;
          padding: 10px;
        }
        .brand .sub,
        .nav-label,
        .sidebar-footer {
          display: none;
        }
        .nav {
          flex-direction: row;
          padding: 4px;
        }
        .nav button {
          width: auto;
        }
      }

      /* ---------------- Payloads visualizer ---------------- */
      .pl-crumbs {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        padding: 2px 0 12px;
        font-size: 13px;
        color: var(--muted);
      }
      .pl-crumbs a {
        color: var(--accent);
        cursor: pointer;
      }
      .pl-crumbs .sep {
        color: var(--dim);
      }
      .pl-crumbs .cur {
        color: var(--text);
        font-weight: 600;
      }
      .pl-list {
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        background: var(--mantle);
      }
      .pl-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }
      .pl-row:last-child {
        border-bottom: none;
      }
      .pl-row:hover {
        background: var(--accent-soft);
      }
      .pl-row .primary {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pl-row .secondary {
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        flex: 0 0 auto;
      }
      .pl-row .badge {
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 999px;
        background: var(--surface0);
        color: var(--subtext0);
      }
      .pl-row .badge.err {
        background: rgba(243, 139, 168, 0.18);
        color: var(--red);
      }
      .pl-row .badge.ok {
        background: rgba(166, 227, 161, 0.16);
        color: var(--green);
      }
      .pl-empty {
        padding: 28px;
        text-align: center;
        color: var(--muted);
      }
      /* detail */
      .pl-detail {
        font-size: 13px;
        line-height: 1.6;
      }
      .pl-section {
        margin: 0 0 18px;
      }
      .pl-section > h3 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
        border-bottom: 1px solid var(--border);
        padding-bottom: 4px;
      }
      .pl-kv {
        display: grid;
        grid-template-columns: 130px 1fr;
        gap: 2px 12px;
        color: var(--subtext0);
      }
      .pl-kv .k {
        color: var(--dim);
      }
      .pl-kv .v.str {
        color: var(--yellow);
      }
      .pl-kv .v.num {
        color: var(--blue);
      }
      .pl-kv .v.bool {
        color: var(--mauve);
      }
      .pl-msg {
        border-left: 3px solid var(--surface1);
        padding: 4px 0 4px 12px;
        margin: 0 0 10px;
      }
      .pl-msg.system {
        border-color: var(--mauve);
      }
      .pl-msg.user {
        border-color: var(--green);
      }
      .pl-msg.assistant {
        border-color: var(--accent);
      }
      .pl-msg .role {
        font-weight: 600;
        text-transform: capitalize;
      }
      .pl-msg.system .role {
        color: var(--mauve);
      }
      .pl-msg.user .role {
        color: var(--green);
      }
      .pl-msg.assistant .role {
        color: var(--accent);
      }
      .pl-block {
        margin: 6px 0 6px 14px;
      }
      .pl-block .btype {
        color: var(--blue);
        font-size: 12px;
      }
      .pl-block .bid {
        color: var(--dim);
        font-size: 11px;
        margin-left: 6px;
      }
      .pl-pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        background: var(--crust);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        margin: 4px 0;
        color: var(--subtext0);
        max-height: 420px;
        overflow: auto;
      }
      .pl-pre.inline {
        margin-left: 14px;
      }
      .pl-tool {
        margin: 6px 0 6px 14px;
      }
      .pl-tool .tname {
        color: var(--green);
        font-weight: 600;
      }
      .pl-tool .tdesc {
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="dot">π</div>
          <div>
            <div class="name">pi-omp-stats</div>
            <div class="sub">AI usage dashboard</div>
          </div>
        </div>
        <nav class="nav" id="nav">
          <div class="nav-label">Usage</div>
          <button data-tab="overview" class="active">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="7" height="9" />
              <rect x="14" y="3" width="7" height="5" />
              <rect x="14" y="12" width="7" height="9" />
              <rect x="3" y="16" width="7" height="5" /></svg
            >Overview
          </button>
          <button data-tab="models">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 2 2 7l10 5 10-5-10-5z" />
              <path d="m2 17 10 5 10-5" />
              <path d="m2 12 10 5 10-5" /></svg
            >Models
          </button>
          <button data-tab="folders">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
              /></svg
            >Folders
          </button>
          <button data-tab="tools">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
              /></svg
            >Tools
          </button>
          <div class="nav-label">Spend</div>
          <button data-tab="costs">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="1" x2="12" y2="23" />
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" /></svg
            >Costs
          </button>
          <button data-tab="providers">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M2 12h20" />
              <path

                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"

    <div class="toast" id="toast"></div>

    <script>
      /* Chart.js loader: try a local ./chart.min.js first (zero-CDN build), then
   fall back to the jsdelivr CDN. To go fully offline, drop a copy of
   Chart.js at dist/chart.min.js (or src/chart.min.js) next to the server. */
      (function () {
        function ready() {
          window.dispatchEvent(new Event("chart-ready"));
        }
        var s = document.createElement("script");
        s.src = "./chart.min.js";
        s.onload = ready;
        s.onerror = function () {
          var c = document.createElement("script");
          c.src = "https://cdn.jsdelivr.net/npm/chart.js";
          c.onload = ready;
          c.onerror = ready; // proceed so tables still render without charts
          document.head.appendChild(c);
        };
        document.head.appendChild(s);
      })();
    </script>

    <script>
      let currentTab = "overview";
      let stats = null,
        behavior = null,
        tools = null,
        providers = null,
        recent = null,
        errorsList = null;
      let costRange = "7d"; // independent window for the "Cost over time" chart
      let profile = "all";
      let charts = {};
      let chartReady = false;

      const $ = (sel) => document.querySelector(sel);
      const main = $("#main");
      const statusEl = $("#status");
      const TITLES = {
        overview: "Overview",
        models: "Models",
        folders: "Folders",
        tools: "Tools",
        behavior: "Behavior",
        costs: "Costs",
        providers: "Providers",
        requests: "Recent Requests",
        errors: "Errors",
        payloads: "Payloads",
      };

      function fmtNum(n) {
        return new Intl.NumberFormat("en-US").format(Math.round(n || 0));
      }
      function fmtCost(n) {
        n = n || 0;
        if (n < 0.01) return "$" + n.toFixed(4);
        if (n < 1) return "$" + n.toFixed(3);
        return "$" + n.toFixed(2);
      }
      function fmtPct(n) {
        if (!Number.isFinite(n)) return "0%";
        return (n * 100).toFixed(1) + "%";
      }
      function fmtDur(ms) {
        if (ms == null || !Number.isFinite(ms)) return "—";
        if (ms < 1000) return Math.round(ms) + "ms";
        return (ms / 1000).toFixed(1) + "s";
      }
      function fmtDate(ms) {
        if (!ms) return "—";
        return new Date(ms).toLocaleString();
      }
      function fmtDateShort(ms) {
        if (!ms) return "—";
        const d = new Date(ms);
        return (
          d.toLocaleDateString([], { month: "short", day: "numeric" }) +
          " " +
          d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
        );
      }
      function toast(msg) {
        const t = $("#toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 1800);
      }

      async function api(path) {
        const sep = path.includes("?") ? "&" : "?";
        const r = await fetch(path + sep + "profile=" + encodeURIComponent(profile));
        if (!r.ok) throw new Error(path + " -> " + r.status);
        return r.json();
      }

      async function loadProfiles() {
        const profiles = await api("/api/profiles");
        if (profiles.length <= 1) return;
        const select = $("#profile-select");
        select.innerHTML = profiles
          .map((p) => `<option value="${p}">${p === "all" ? "All profiles" : p}</option>`)
          .join("");
        select.value = profile;
        select.hidden = false;
      }

      function range() {
        return document.querySelector("#range-seg button.active")?.dataset.range || "24h";
      }

      function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }
      const PALETTE = () => [
        cssVar("--blue"),
        cssVar("--green"),
        cssVar("--yellow"),
        cssVar("--red"),
        cssVar("--mauve"),
        cssVar("--sky"),
        cssVar("--peach"),
        cssVar("--teal"),
        cssVar("--pink"),
        cssVar("--lavender"),
      ];

      function card(label, value, sub, accent) {
        return `<div class="card" style="--card-accent:${accent || "var(--accent)"}"><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
      }

      function table(headers, rows, numClasses) {
        const th = headers
          .map((h, i) => `<th class="${(numClasses && numClasses[i]) || ""}">${h}</th>`)
          .join("");
        const trs = rows
          .map(
            (r) =>
              `<tr>${r.map((c, i) => `<td class="${(numClasses && numClasses[i]) || ""}">${c}</td>`).join("")}</tr>`,
          )
          .join("");
        return `<table><thead><tr>${th}</tr></thead><tbody>${trs || `<tr><td colspan="${headers.length}" class="empty">No data</td></tr>`}</tbody></table>`;
      }

      function destroyCharts() {
        for (const k in charts) {
          try {
            charts[k].destroy();
          } catch (e) {}
          delete charts[k];
        }
      }
      function ensureChart(id) {
        const canvas = document.getElementById(id);
        if (!canvas) return null;
        if (charts[id]) {
          try {
            charts[id].destroy();
          } catch (e) {}
        }
        return canvas.getContext("2d");
      }

      function baseChartOpts() {
        if (typeof Chart !== "undefined") {
          Chart.defaults.font.size = 13;
          Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
        }
        const muted = cssVar("--muted"),
          grid = cssVar("--border");
        return {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: {
              labels: {
                color: muted,
                boxWidth: 12,
                boxHeight: 12,
                usePointStyle: true,
                pointStyle: "rectRounded",
                padding: 16,
                font: { size: 12 },
              },
            },
            tooltip: {
              backgroundColor: cssVar("--surface0"),
              titleColor: cssVar("--text"),
              bodyColor: cssVar("--subtext0"),
              borderColor: cssVar("--border-strong"),
              borderWidth: 1,
              padding: 11,
              cornerRadius: 8,
              titleFont: { weight: "600", size: 13 },
              bodyFont: { size: 13 },
              boxPadding: 4,
            },
          },
          scales: {
            x: {
              ticks: { color: muted, maxRotation: 0, autoSkip: true, font: { size: 12 } },
              grid: { color: "transparent" },
              border: { color: grid },
            },
            y: {
              ticks: { color: muted, font: { size: 12 } },
              grid: { color: grid },
              border: { display: false },
            },
          },
        };
      }
      function yTitle(o, text) {
        if (text) o.scales.y.title = { display: true, text, color: cssVar("--dim") };
        return o;
      }
      function stacked(o) {
        o.scales.x.stacked = true;
        o.scales.y.stacked = true;
        return o;
      }

      function drawTimeSeries(points) {
        if (!chartReady || typeof Chart === "undefined" || !points || points.length === 0) return;
        const ctx = ensureChart("ts-chart");
        if (!ctx) return;
        const labels = points.map((p) => fmtDateShort(p.timestamp));
        const blue = cssVar("--blue"),
          red = cssVar("--red");
        const pointRadius = points.length <= 2 ? 3 : 0;
        charts["ts-chart"] = new Chart(ctx, {
          data: {
            labels,
            datasets: [
              {
                type: "bar",
                label: "Requests",
                data: points.map((p) => p.requests),
                backgroundColor: blue + "b3",
                borderRadius: 3,
                yAxisID: "y",
                order: 2,
              },
              {
                type: "line",
                label: "Errors",
                data: points.map((p) => p.errors),
                borderColor: red,
                backgroundColor: red + "26",
                tension: 0.3,
                borderWidth: 2,
                pointRadius,
                pointHoverRadius: 4,
                fill: true,
                yAxisID: "y1",
                order: 1,
              },
            ],
          },
          options: (() => {
            const o = baseChartOpts();
            o.scales.y1 = {
              position: "right",
              ticks: { color: cssVar("--muted"), font: { size: 12 } },
              grid: { drawOnChartArea: false },
              border: { display: false },
            };
            return o;
          })(),
        });
      }

      function drawStackedArea(canvasId, series, valueKey, label) {
        if (!chartReady || typeof Chart === "undefined" || !series || series.length === 0) return;
        const buckets = [...new Set(series.map((p) => p.timestamp))].sort((a, b) => a - b);
        const keys = [...new Set(series.map((p) => (p.model !== undefined ? p.model : p.tool)))];
        const byKey = new Map();
        for (const p of series) {
          const k = p.model !== undefined ? p.model : p.tool;
          if (!byKey.has(k)) byKey.set(k, {});
          byKey.get(k)[p.timestamp] = p[valueKey];
        }
        const palette = PALETTE();
        const datasets = keys.map((k, i) => ({
          label: k,
          data: buckets.map((b) => byKey.get(k)[b] || 0),
          backgroundColor: palette[i % palette.length] + "8c",
          borderColor: palette[i % palette.length],
          fill: true,
          tension: 0.3,
          pointRadius: 0,
          borderWidth: 1.5,
        }));
        const ctx = ensureChart(canvasId);
        if (!ctx) return;
        charts[canvasId] = new Chart(ctx, {
          type: "line",
          data: { labels: buckets.map((b) => fmtDateShort(b)), datasets },
          options: stacked(yTitle(baseChartOpts(), label)),
        });
      }

      function drawCostByModel(points) {
        if (!chartReady || typeof Chart === "undefined" || !points || points.length === 0) return;
        const buckets = [...new Set(points.map((p) => p.timestamp))].sort((a, b) => a - b);
        const models = [...new Set(points.map((p) => p.model))];
        const palette = PALETTE();
        const datasets = models.map((m, i) => ({
          label: m,
          data: buckets.map((b) =>
            points
              .filter((p) => p.timestamp === b && p.model === m)
              .reduce((s, p) => s + p.cost, 0),
          ),
          backgroundColor: palette[i % palette.length] + "a6",
          borderColor: palette[i % palette.length],
          borderWidth: 1,
          borderRadius: 3,
          stack: "cost",
        }));
        const ctx = ensureChart("costs-chart");
        if (!ctx) return;
        charts["costs-chart"] = new Chart(ctx, {
          type: "bar",
          data: { labels: buckets.map((b) => fmtDateShort(b)), datasets },
          options: stacked(yTitle(baseChartOpts(), "Cost ($)")),
        });
      }

      /* ---------------- Renders ---------------- */

      async function loadOverview() {
        stats = await api("/api/stats?range=" + range());
        renderOverview();
        // Load the independent "Cost over time" chart after the overview paints.
        drawCostOverTime(costRange);
      }

      /* "Cost over time" for the selected window. Uses finer-than-daily buckets for
   short/medium ranges (2h for 24h and 7d, 6h for 30d, 12h for 90d) so the
   curve is smooth instead of a handful of day-points; daily for `all`. */
      function costBucketFor(r) {
        const H = 3600 * 1000;
        switch (r) {
          case "1h":
            return 5 * 60 * 1000; // 5 min
          case "24h":
            return 2 * H; // 2h
          case "7d":
            return 2 * H; // 2h
          case "30d":
            return 6 * H; // 6h
          case "90d":
            return 12 * H; // 12h
          case "all":
            return 24 * H; // 1d
          default:
            return 2 * H;
        }
      }

      async function drawCostOverTime(r) {
        if (!chartReady || typeof Chart === "undefined") return;
        const bucket = costBucketFor(r);
        const d = await api("/api/stats/costs?range=" + r + "&bucket=" + bucket);
        const points = d.costSeries;
        const ctx = ensureChart("cost-chart");
        if (!ctx) return;
        if (!points || points.length === 0) return;
        // Pivot per-model cost into stacked bars: one dataset per model, one bar per bucket.
        const buckets = [...new Set(points.map((p) => p.timestamp))].sort((a, b) => a - b);
        const models = [...new Set(points.map((p) => p.model))];
        const byModel = new Map(models.map((m) => [m, {}]));
        for (const p of points)
          byModel.get(p.model)[p.timestamp] = (byModel.get(p.model)[p.timestamp] || 0) + p.cost;
        const palette = PALETTE();
        const subDaily = bucket < 24 * 3600 * 1000;
        const labels = buckets.map((b) => (subDaily ? fmtDateShort(b) : fmtDay(b)));
        const datasets = models.map((m, i) => ({
          label: m,
          data: buckets.map((b) => byModel.get(m)[b] || 0),
          backgroundColor: palette[i % palette.length] + "a6",
          borderColor: palette[i % palette.length],
          borderWidth: 1,
          borderRadius: 3,
          stack: "cost",
        }));
        charts["cost-chart"] = new Chart(ctx, {
          type: "bar",
          data: { labels, datasets },
          options: (() => {
            const o = stacked(yTitle(baseChartOpts(), "Cost ($)"));
            o.scales.y.ticks.callback = (v) => "$" + v;
            o.plugins.tooltip.callbacks = {
              label: (c) => ` ${c.dataset.label}: ${fmtCost(c.parsed.y)}`,
            };
            return o;
          })(),
        });
      }

      function fmtDay(ms) {
        const d = new Date(ms);
        return d.toLocaleDateString([], { month: "short", day: "numeric" });
      }
      function fmtTime(ms) {
        const d = new Date(ms);
        return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      }

      function renderOverview() {
        const o = stats.overall;
        const cards = `
    ${card("Requests", fmtNum(o.totalRequests), fmtNum(o.failedRequests) + " errors", "var(--blue)")}
    ${card("Total Cost", fmtCost(o.totalCost), fmtCost(o.totalCost / Math.max(1, o.totalRequests)) + " / req", "var(--green)")}
    ${card("Cache Rate", fmtPct(o.cacheRate), fmtNum(o.totalCacheReadTokens) + " cached tok", "var(--teal)")}
    ${card("Cache Savings", fmtPct(o.cacheSavings), "vs uncached input", "var(--teal)")}
    ${card("Error Rate", fmtPct(o.errorRate), fmtNum(o.successfulRequests) + " ok", "var(--red)")}
    ${card("Avg Latency", fmtDur(o.avgDuration), "duration", "var(--yellow)")}
    ${card("Avg TTFT", fmtDur(o.avgTtft), "first token", "var(--yellow)")}
    ${card("Tokens / s", o.avgTokensPerSecond != null ? o.avgTokensPerSecond.toFixed(1) : "—", "output rate", "var(--mauve)")}
  `;
        main.innerHTML = `<div class="cards">${cards}</div>
    <div class="chart-wrap"><h3>Requests & errors over time</h3><canvas id="ts-chart"></canvas></div>
    <div class="chart-wrap">
      <div class="chart-head">
        <h3>Cost over time</h3>
        <div class="seg seg-sm" id="cost-seg">
          <button data-cost="24h">24h</button>
          <button data-cost="7d" class="active">7d</button>
          <button data-cost="30d">30d</button>
          <button data-cost="90d">90d</button>
          <button data-cost="all">All</button>
        </div>
      </div>
      <canvas id="cost-chart"></canvas>
    </div>
    <div class="section-title">By agent type</div>
    <div id="agent-table"></div>
    <div class="section-title">Top models</div>
    <div id="top-models"></div>
    <div class="section-title">Top folders</div>
    <div id="top-folders"></div>
  `;
        renderAgentTable(stats.byAgentType);
        renderModelTable("#top-models", stats.byModel.slice(0, 8));
        document.getElementById("top-folders").innerHTML = renderFolderTree(
          stats.byFolder.slice(0, 12),
        );
        drawTimeSeries(stats.timeSeries);
        wireCostSeg();
      }

      function renderAgentTable(rows) {
        if (!rows || rows.length === 0) {
          $("#agent-table").innerHTML = `<div class="empty">No data</div>`;
          return;
        }
        $("#agent-table").innerHTML = table(
          ["Agent", "Requests", "Input", "Output", "Cache R", "Cache W", "Cost"],
          rows.map((r) => [
            r.agentType,
            fmtNum(r.totalRequests),
            fmtNum(r.totalInputTokens),
            fmtNum(r.totalOutputTokens),
            fmtNum(r.totalCacheReadTokens),
            fmtNum(r.totalCacheWriteTokens),
            fmtCost(r.totalCost),
          ]),
          ["", "num", "num", "num", "num", "num", "num"],
        );
      }

      function renderModelTable(sel, rows) {
        $(sel).innerHTML = table(
          [
            "Model",
            "Provider",
            "Reqs",
            "Errors",
            "Input",
            "Output",
            "Cache R",
            "Cache W",
            "Cache %",
            "Savings",
            "Cost",
            "Tok/s",
          ],
          rows.map((m) => [
            `<span class="model" style="color:var(--accent)">${m.model}</span>`,
            m.provider,
            fmtNum(m.totalRequests),
            fmtNum(m.failedRequests),
            fmtNum(m.totalInputTokens),
            fmtNum(m.totalOutputTokens),
            fmtNum(m.totalCacheReadTokens),
            fmtNum(m.totalCacheWriteTokens),
            fmtPct(m.cacheRate),
            fmtPct(m.cacheSavings),
            fmtCost(m.totalCost),
            m.avgTokensPerSecond != null ? m.avgTokensPerSecond.toFixed(1) : "—",
          ]),
          ["", "", "num", "num", "num", "num", "num", "num", "num", "num", "num", "num"],
        );
      }

      function renderFolderTable(sel, rows) {
        $(sel).innerHTML = table(
          ["Folder", "Reqs", "Errors", "Input", "Output", "Cache R", "Cache W", "Cache %", "Cost"],
          rows.map((f) => [
            `<span class="folder truncate" title="${f.folder}">${f.folder}</span>`,
            fmtNum(f.totalRequests),
            fmtNum(f.failedRequests),
            fmtNum(f.totalInputTokens),
            fmtNum(f.totalOutputTokens),
            fmtNum(f.totalCacheReadTokens),
            fmtNum(f.totalCacheWriteTokens),
            fmtPct(f.cacheRate),
            fmtCost(f.totalCost),
          ]),
          ["", "num", "num", "num", "num", "num", "num", "num", "num"],
        );
      }

      /* ---- Folder tree (du/tree-style hierarchical view) ---- */

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function buildFolderTree(rows) {
        const root = { name: "", children: new Map(), stats: null };
        for (const f of rows) {
          const segs = f.folder.split("/").filter(Boolean);
          let node = root;
          for (const seg of segs) {
            if (!node.children.has(seg))
              node.children.set(seg, { name: seg, children: new Map(), stats: null });
            node = node.children.get(seg);
          }
          node.stats = f;
        }
        return root;
      }

      /* Merge single-child chains that carry no stats of their own (e.g.
   /Users/alexandre.mendonca/orca/workspaces/ → one combined prefix). */
      function collapseFolderTree(node) {
        while (!node.stats && node.children.size === 1) {
          const [cname, cnode] = [...node.children.entries()][0];
          node = {
            name: node.name ? node.name + "/" + cname : cname,
            children: cnode.children,
            stats: cnode.stats,
          };
        }
        const newChildren = new Map();
        for (const [cname, cnode] of node.children)
          newChildren.set(cname, collapseFolderTree(cnode));
        return { name: node.name, children: newChildren, stats: node.stats };
      }

      /* Bottom-up totals so branch rows roll up their subtree (like du -s). */
      function aggregateFolderTree(node) {
        const total = {
          totalRequests: 0,
          failedRequests: 0,
          totalInputTokens: 0,
          totalOutputTokens: 0,
          totalCacheReadTokens: 0,
          totalCacheWriteTokens: 0,
          totalCost: 0,
        };
        const add = (s) => {
          total.totalRequests += s.totalRequests;
          total.failedRequests += s.failedRequests;
          total.totalInputTokens += s.totalInputTokens;
          total.totalOutputTokens += s.totalOutputTokens;
          total.totalCacheReadTokens += s.totalCacheReadTokens;
          total.totalCacheWriteTokens += s.totalCacheWriteTokens;
          total.totalCost += s.totalCost;
        };
        if (node.stats) add(node.stats);
        for (const [, c] of node.children) add(aggregateFolderTree(c));
        node.total = total;
        return total;
      }

      function renderFolderTree(rows) {
        if (!rows || rows.length === 0) return `<div class="empty">No data</div>`;
        const tree = collapseFolderTree(buildFolderTree(rows));
        aggregateFolderTree(tree);

        const body = [];
        const emit = (node, prefix, isLast, isRootRow) => {
          const isBranch = node.children.size > 0;
          const s = isBranch ? node.total : node.stats;
          const cacheRate =
            s.totalInputTokens + s.totalCacheReadTokens > 0
              ? s.totalCacheReadTokens / (s.totalInputTokens + s.totalCacheReadTokens)
              : 0;
          const connector = isRootRow ? "" : isLast ? "└─ " : "├─ ";
          body.push(
            `<tr class="${isBranch ? "tree-branch" : "tree-leaf"}">` +
              `<td class="folder"><span class="tree-pre">${escapeHtml(prefix)}</span>${escapeHtml(connector)}<span class="tree-name">${escapeHtml(node.name)}</span></td>` +
              `<td class="num">${fmtNum(s.totalRequests)}</td><td class="num">${fmtNum(s.failedRequests)}</td>` +
              `<td class="num">${fmtNum(s.totalInputTokens)}</td><td class="num">${fmtNum(s.totalOutputTokens)}</td>` +
              `<td class="num">${fmtNum(s.totalCacheReadTokens)}</td><td class="num">${fmtNum(s.totalCacheWriteTokens)}</td>` +
              `<td class="num">${fmtPct(cacheRate)}</td><td class="num">${fmtCost(s.totalCost)}</td></tr>`,
          );
          const childPrefix = prefix + (isRootRow ? "" : isLast ? "   " : "│  ");
          const kids = [...node.children.values()].sort(
            (a, b) =>
              (b.total?.totalCost || b.stats?.totalCost || 0) -
              (a.total?.totalCost || a.stats?.totalCost || 0),
          );
          kids.forEach((c, i) => emit(c, childPrefix, i === kids.length - 1, false));
        };

        if (tree.name && tree.children.size) {
          // common-prefix root (e.g. /Users/alexandre.mendonca) — show as the top row
          emit(tree, "", true, true);
        } else {
          const kids = [...tree.children.values()].sort(
            (a, b) =>
              (b.total?.totalCost || b.stats?.totalCost || 0) -
              (a.total?.totalCost || a.stats?.totalCost || 0),
          );
          kids.forEach((c, i) => emit(c, "", i === kids.length - 1, false));
        }

        return `<table class="folder-tree"><thead><tr><th>Folder</th><th class="num">Reqs</th><th class="num">Errors</th><th class="num">Input</th><th class="num">Output</th><th class="num">Cache R</th><th class="num">Cache W</th><th class="num">Cache %</th><th class="num">Cost</th></tr></thead><tbody>${body.join("")}</tbody></table>`;
      }

      /* ---------------- Payloads visualizer ---------------- */
      // Mirrors the old payload-browser TUI: dates -> sessions -> file list ->
      // formatted detail, with an errors.jsonl browser and jump-to-source.
      const pl = {
        view: "dates", // dates | sessions | list | detail | errors
        dates: [],
        flat: 0,
        sessions: [],
        files: [],
        errors: [],
        curDate: "",
        curSession: { name: "", rel: "" },
        curFile: { file: "", rel: "" },
        detail: null,
        payloadsRoot: "",
      };

      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function fmtBytes(n) {
        n = n || 0;
        if (n < 1024) return n + "B";
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + "KB";
        return (n / 1024 / 1024).toFixed(1) + "MB";
      }
      function prettyJson(v) {
        try {
          return JSON.stringify(v, null, 2);
        } catch {
          return String(v);
        }
      }
      function shorten(s, n) {
        s = String(s ?? "")
          .replace(/\s+/g, " ")
          .trim();
        return s.length > n ? s.slice(0, n - 1) + "…" : s;
      }

      function plCrumb(parts) {
        // parts: [{label, go?}] — last is current (no go).
        return parts
          .map((p, i) => {
            const last = i === parts.length - 1;
            const sep = i > 0 ? `<span class="sep">›</span>` : "";
            if (last || !p.go) return `${sep}<span class="cur">${esc(p.label)}</span>`;
            return `${sep}<a class="pl-go" data-go="${p.go}">${esc(p.label)}</a>`;
          })
          .join(" ");
      }

      async function loadPayloads() {
        const probe = await api("/api/payloads");
        pl.payloadsRoot = probe.root || "";
        if (!probe.exists) {
          main.innerHTML =
            `<div class="pl-empty">No payloads directory found.` +
            (pl.payloadsRoot ? `<br><code>${esc(pl.payloadsRoot)}</code>` : "") +
            `<br><span class="empty">Enable the payload-exporter extension in pi with <code>/payload-exporter on</code>.</span></div>`;
          return;
        }
        await plLoadDates();
      }

      async function plLoadDates() {
        pl.view = "dates";
        const d = await api("/api/payloads/dates");
        pl.dates = d.dates || [];
        pl.flat = d.flat || 0;
        const crumbs = plCrumb([{ label: "Payloads", go: "dates" }, { label: "Dates" }]);
        if (pl.dates.length === 0 && pl.flat === 0) {
          main.innerHTML =
            crumbs +
            `<div class="pl-empty">No payload dumps yet. Toggle the exporter on with <code>/payload-exporter on</code> in pi, then Sync.</div>`;
          return;
        }
        const rows = pl.dates
          .map((dt) => {
            return `<div class="pl-row" data-go="date" data-date="${esc(dt.name)}">
              <span class="primary"><span style="color:var(--accent">${esc(dt.name)}</span></span>
              <span class="secondary">${dt.sessions} session${dt.sessions === 1 ? "" : "s"}</span>
            </div>`;
          })
          .join("");
        const flatRow = pl.flat
          ? `<div class="pl-row" data-go="flat">
              <span class="primary"><span style="color:var(--yellow)">legacy flat files</span></span>
              <span class="secondary">${pl.flat} file${pl.flat === 1 ? "" : "s"}</span>
            </div>`
          : "";
        main.innerHTML =
          crumbs +
          `<div class="pl-list">${rows}${flatRow}</div>` +
          `<div class="pl-empty" style="border:none;padding:14px 2px;color:var(--dim);font-size:12px">source: <code>${esc(d.root)}</code></div>`;
        plWireRows();
      }

      async function plLoadSessions(date) {
        pl.view = "sessions";
        pl.curDate = date;
        const d = await api("/api/payloads/sessions?date=" + encodeURIComponent(date));

          { label: "Payloads", go: "dates" },
          { label: date, go: "date:" + date },

        }

            const err = s.hasErrors ? `<span class="badge err">errors</span>` : "";

              <span class="primary"><span style="color:var(--green)">${esc(s.name)}</span></span>

      async function plLoadList(dir, label) {
        pl.view = "list";
        pl.curSession = { name: label, rel: dir };
        const d = await api("/api/payloads/files?dir=" + encodeURIComponent(dir));
        pl.files = d.files || [];
        pl.errors = d.errors || [];
        const crumbs = plCrumb([
          { label: "Payloads", go: "dates" },
          ...(dir && dir.includes("/")
            ? [{ label: dir.split("/")[0], go: "date:" + dir.split("/")[0] }]

        ]);

          ? `<button class="btn" id="pl-errs-btn" style="margin-left:auto">${pl.errors.length} errors</button>`
          : "";
        let body = `<div class="pl-crumbs">${crumbs}${errBtn}</div>`;
        if (pl.files.length === 0) {
          body += `<div class="pl-empty">No payload files in this session.</div>`;
        } else {
          body += `<div class="pl-list">${pl.files
            .map((f) => {
              const resp = f.hasResp
                ? `<span class="badge ok">resp</span>`
                : `<span class="badge">no resp</span>`;
              const time = f.time || f.date || "";
              return `<div class="pl-row" data-go="file" data-rel="${esc(f.rel)}">
                <span class="secondary" style="width:84px">t${f.turn ?? "?"} · ${esc(f.seq ?? "?")}</span>
                <span class="secondary" style="width:120px;color:var(--blue)">${esc(time)}</span>
                <span class="primary"><span style="color:var(--green)">${esc(f.model || "?")}</span></span>
                <span class="secondary">${fmtBytes(f.size)}</span>
                ${resp}
              </div>`;
            })
            .join("")}</div>`;
        }
        main.innerHTML = body;
        plWireRows();
        const eb = document.getElementById("pl-errs-btn");

          eb.addEventListener("click", () => plLoadErrors(pl.curSession.rel, pl.curSession.name));

      async function plLoadErrors(dir, label) {
        pl.view = "errors";
        const d = await api("/api/payloads/errors?dir=" + encodeURIComponent(dir));
        pl.errors = d.errors || [];
        const crumbs = plCrumb([
          { label: "Payloads", go: "dates" },
          ...(dir && dir.includes("/")
            ? [{ label: dir.split("/")[0], go: "date:" + dir.split("/")[0] }]
            : []),
          { label: label || "flat", go: "session:" + dir + ":" + (label || "flat") },
          { label: "errors.jsonl" },
        ]);
        if (pl.errors.length === 0) {
          main.innerHTML = crumbs + `<div class="pl-empty">No error entries.</div>`;
          return;
        }
        const rows = pl.errors
          .map((e) => {
            const first = e.matches && e.matches[0];
            const labelTxt = first
              ? `${esc(first.pattern)}${first.toolName ? " · " + esc(first.toolName) : ""}`
              : e.raw
                ? "(unparseable)"
                : "?";
            const file = e.file || "";
            return (
              `<div class="pl-row" data-go="errfile" data-file="${esc(file)}">
              <span class="secondary" style="width:40px;color:var(--dim)">${esc(e.i)}</span>
              <span class="secondary" style="width:80px;color:var(--mauve)">${esc(e.source || "?")}</span>
              <span class="primary"><span style="color:var(--yellow)">${labelTxt}</span>` +
              (first
                ? `<br><span style="color:var(--dim);font-size:11px">${esc(shorten(first.snippet, 140))}</span>`
                : "") +
              `</span>
              <span class="secondary">${esc(file)}</span>
            </div>`
            );
          })
          .join("");
        main.innerHTML = crumbs + `<div class="pl-list">${rows}</div>`;
        plWireRows();
      }

      async function plLoadDetail(rel) {
        pl.view = "detail";
        pl.curFile = { file: rel.split("/").pop(), rel };
        const r = await api("/api/payloads/file?path=" + encodeURIComponent(rel));
        pl.detail = r.data;
        const sessionRel = rel.includes("/") ? rel.slice(0, rel.lastIndexOf("/")) : "";
        const sessionLabel = sessionRel ? sessionRel.split("/").pop() : "flat";
        const crumbs = plCrumb([
          { label: "Payloads", go: "dates" },
          ...(sessionRel && sessionRel.includes("/")
            ? [{ label: sessionRel.split("/")[0], go: "date:" + sessionRel.split("/")[0] }]
            : []),
          { label: sessionLabel, go: "session:" + sessionRel + ":" + sessionLabel },
          { label: pl.curFile.file },
        ]);
        main.innerHTML = `<div class="pl-crumbs">${crumbs}</div><div class="pl-detail">${plRenderDetail(pl.detail)}</div>`;
      }

      function plRenderDetail(payload) {
        if (!payload || payload.__error) {
          return `<div class="pl-empty">error reading file: ${esc(payload && payload.__error)}</div>`;
        }
        const p = payload.payload || {};
        const messages = p.messages || [];
        const tools = p.tools || [];
        let html = "";

        // METADATA
        html += `<div class="pl-section"><h3>Metadata</h3><div class="pl-kv">`;
        html += plKv("savedAt", payload.savedAt);
        html += plKv("turnIndex", payload.turnIndex);
        html += plKv("model", payload.model && payload.model.id);
        html += plKv("provider", payload.model && payload.model.provider);
        html += plKv("has response", payload.response ? "yes" : "no");
        html += `</div></div>`;

        // MESSAGES
        html += `<div class="pl-section"><h3>Messages (${messages.length})</h3>`;
        if (messages.length === 0) html += `<div class="empty">none</div>`;
        messages.forEach((msg, i) => {
          html += plRenderMsg(i, msg);
        });
        html += `</div>`;

        // TOOLS
        html += `<div class="pl-section"><h3>Tools (${tools.length})</h3>`;
        if (tools.length === 0) html += `<div class="empty">none</div>`;
        tools.forEach((t, i) => {
          const fn = t.function || t;
          const name = fn.name || t.name || "?";
          const desc = fn.description || t.description || "";
          html +=
            `<div class="pl-tool"><span class="tname">[${i}] ${esc(name)}</span>` +
            (desc ? ` <span class="tdesc">${esc(shorten(desc, 140))}</span>` : "") +
            `</div>`;
        });
        html += `</div>`;

        // OTHER PAYLOAD FIELDS
        const known = new Set(["model", "messages", "tools"]);
        const misc = Object.entries(p).filter(([k]) => !known.has(k));
        if (misc.length) {
          html += `<div class="pl-section"><h3>Other payload fields</h3>`;
          for (const [k, v] of misc) {
            html += `<div class="pl-kv"><span class="k">${esc(k)}</span><span class="v"><div class="pl-pre">${esc(prettyJson(v))}</div></span></div>`;
          }
          html += `</div>`;
        }

        // RESPONSE
        const r = payload.response;
        html += `<div class="pl-section"><h3>Response</h3>`;
        if (!r) {
          html += `<div class="empty">(no response recorded — request-only dump)</div>`;
        } else {
          html += `<div class="pl-kv">`;
          html += plKv("stopReason", r.stopReason);
          html += plKv("model", r.model);
          html += plKv("responseId", r.responseId);
          html += plKv("provider", r.provider);
          if (r.timestamp) html += plKv("timestamp", r.timestamp);
          if (r.usage) {
            html += `</div><div class="pl-kv"><span class="k">usage</span><span class="v"><div class="pl-pre">${esc(prettyJson(r.usage))}</div></span></div><div class="pl-kv">`;
          }
          if (r.cost) html += plKv("cost", r.cost, true);
          if (r.errorMessage) html += plKv("errorMessage", r.errorMessage);
          html += `</div>`;
          if (r.textPreview) {
            html += `<div class="pl-pre" style="margin-top:6px">${esc(r.textPreview)}</div>`;
          }
        }
        html += `</div>`;
        return html;
      }

      function plKv(k, v, raw) {
        if (v === undefined || v === null)
          return `<span class="k">${esc(k)}</span><span class="v" style="color:var(--dim)">—</span>`;
        let cls = "";
        let val = v;
        if (!raw) {
          if (typeof v === "string") {
            cls = "str";
            val = esc(v);
          } else if (typeof v === "number") {
            cls = "num";
            val = esc(String(v));
          } else if (typeof v === "boolean") {
            cls = "bool";
            val = esc(String(v));
          } else {
            val = `<div class="pl-pre">${esc(prettyJson(v))}</div>`;
          }
        } else {
          val = `<div class="pl-pre">${esc(prettyJson(v))}</div>`;
        }
        return `<span class="k">${esc(k)}</span><span class="v ${cls}">${val}</span>`;
      }

      function plRenderMsg(i, msg) {
        const role = msg.role || "?";
        const content = msg.content;
        let body = "";
        if (typeof content === "string") {
          body += `<div class="pl-pre">${esc(content)}</div>`;
        } else if (Array.isArray(content)) {
          content.forEach((block) => {
            body += plRenderBlock(block);
          });
        } else if (content !== undefined) {
          body += `<div class="pl-pre">${esc(prettyJson(content))}</div>`;
        }
        if (msg.tool_calls || msg.toolCalls) {
          const calls = msg.tool_calls || msg.toolCalls;
          body += `<div class="pl-block"><span class="btype">tool_calls</span></div>`;
          calls.forEach((tc, ci) => {
            const name = (tc.function && tc.function.name) || tc.name || "?";
            const args = (tc.function && tc.function.arguments) || tc.arguments;
            body += `<div class="pl-block"><span class="btype">[${ci}] ${esc(name)}</span></div>`;
            body += `<div class="pl-pre inline">${esc(typeof args === "string" ? args : prettyJson(args))}</div>`;
          });
        }
        return `<div class="pl-msg ${esc(role)}"><div><span class="role">[${i}] ${esc(role)}</span></div>${body}</div>`;
      }

      function plRenderBlock(block) {
        const type = (block && block.type) || "?";
        let body = `<div class="pl-block"><span class="btype">${esc(type)}</span>`;
        if (block && block.id) body += `<span class="bid">${esc(block.id)}</span>`;
        body += `</div>`;
        if (type === "text" && typeof block.text === "string") {
          body += `<div class="pl-pre inline">${esc(block.text)}</div>`;
        } else if (type === "tool_use" || type === "functionCall") {
          const name = block.name || (block.function && block.function.name);
          const input =
            block.input || (block.function && block.function.arguments) || block.arguments;
          body += `<div class="pl-block"><span class="btype">name: ${esc(name)}</span></div>`;
          if (input !== undefined)
            body += `<div class="pl-pre inline">${esc(typeof input === "string" ? input : prettyJson(input))}</div>`;
        } else if (type === "tool_result" || type === "functionCallOutput" || type === "output") {
          const out = block.content || block.output;
          const tuid = block.tool_use_id || block.toolCallId || block.call_id;
          if (tuid)
            body += `<div class="pl-block"><span class="btype">toolUseId: ${esc(tuid)}</span></div>`;
          if (typeof out === "string") body += `<div class="pl-pre inline">${esc(out)}</div>`;
          else if (Array.isArray(out))
            out.forEach((part) => {
              body += `<div class="pl-pre inline">${esc(part && part.type === "text" ? part.text : prettyJson(part))}</div>`;
            });
          else if (out !== undefined)
            body += `<div class="pl-pre inline">${esc(prettyJson(out))}</div>`;
        } else if (type === "thinking" || type === "reasoning") {
          const t = block.thinking || block.reasoning || block.text;
          body += `<div class="pl-pre inline">${esc(String(t ?? ""))}</div>`;
        } else {
          body += `<div class="pl-pre inline">${esc(prettyJson(block))}</div>`;
        }
        return body;
      }

      // Wire .pl-row clicks + crumb `data-go` navigation.
      function plWireRows() {
        main.querySelectorAll(".pl-row[data-go]").forEach((row) => {
          row.addEventListener("click", () => plDispatch(row.dataset));
        });
        main.querySelectorAll("a.pl-go[data-go]").forEach((a) => {
          a.addEventListener("click", (ev) => {
            ev.preventDefault();
            plDispatch({ go: a.dataset.go });
          });
        });
      }

      // Dispatch a navigation action encoded in a dataset.
      function plDispatch(ds) {
        const go = ds.go;
        if (!go) return;
        if (go === "dates") return plLoadDates();
        if (go === "flat") return plLoadList("", "flat");
        if (go === "date") return plLoadSessions(ds.date);
        if (go === "session")
          return plLoadList(ds.rel, (ds.rel && ds.rel.split("/").pop()) || "flat");
        if (go === "file") return plLoadDetail(ds.rel);
        if (go === "errfile") {
          if (!ds.file) return;
          const rel = (pl.curSession.rel ? pl.curSession.rel + "/" : "") + ds.file;
          return plLoadDetail(rel);
        }
        if (go.startsWith("date:")) return plLoadSessions(go.slice(5));
        if (go.startsWith("session:")) {
          const [, dir, label] = go.split(":");
          return plLoadList(dir || "", label || "flat");
        }
      }

      function wireCostSeg() {
        const seg = document.getElementById("cost-seg");
        if (!seg) return;
        // Reflect the current costRange in the (freshly re-rendered) selector.
        seg
          .querySelectorAll("button")
          .forEach((b) => b.classList.toggle("active", b.dataset.cost === costRange));
        if (seg.dataset.wired) return;
        seg.dataset.wired = "1";
        seg.querySelectorAll("button").forEach((b) =>
          b.addEventListener("click", () => {
            costRange = b.dataset.cost;
            seg.querySelectorAll("button").forEach((x) => x.classList.toggle("active", x === b));
            drawCostOverTime(costRange);
          }),
        );
      }

      /* ---------------- Wiring ---------------- */

      async function refreshAll() {
        statusEl.textContent = "Loading…";
        try {
          await renderTab(currentTab);
          $("#updated-at").textContent =
            "Updated " +
            new Date().toLocaleTimeString([], {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
            });
          statusEl.textContent = "";
        } catch (e) {
          statusEl.textContent = "Error: " + e.message;
        }
      }

      async function doSync() {
        $("#sync-btn").disabled = true;
        statusEl.textContent = "Syncing…";
        try {
          const r = await fetch("/api/sync?profile=" + encodeURIComponent(profile), {
            method: "POST",
          });
          const j = await r.json();
          statusEl.textContent = "";
          toast(`Synced ${j.processed} new entries · ${j.totalMessages} total`);
          stats = null;
          behavior = null;
          tools = null;
          providers = null;
          recent = null;
          errorsList = null;
          await renderTab(currentTab);
        } catch (e) {
          statusEl.textContent = "Sync error: " + e.message;
        } finally {
          $("#sync-btn").disabled = false;
        }
      }

      document.querySelectorAll("#nav button").forEach((b) =>
        b.addEventListener("click", () => {
          stats = null;
          renderTab(b.dataset.tab);
        }),
      );
      document.querySelectorAll("#range-seg button").forEach((b) =>
        b.addEventListener("click", () => {
          document
            .querySelectorAll("#range-seg button")
            .forEach((x) => x.classList.remove("active"));
          b.classList.add("active");
          // Payloads are not range-scoped — don't disrupt an in-progress browse.
          if (currentTab === "payloads") return;
          stats = null;
          behavior = null;
          tools = null;
          providers = null;
          errorsList = null;
          refreshAll();
        }),
      );
      $("#sync-btn").addEventListener("click", doSync);
      $("#profile-select").addEventListener("change", (event) => {
        profile = event.target.value;
        stats = behavior = tools = providers = recent = errorsList = null;
        refreshAll();
      });

      $("#theme-toggle").addEventListener("click", () => {
        const cur =
          document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", cur);
        try {
          localStorage.setItem("pi-omp-stats-theme", cur);
        } catch (e) {}
        $("#theme-icon").innerHTML =
          cur === "dark"
            ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>'
            : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        refreshAll(); // re-render charts with the new palette
      });

      loadProfiles().catch((e) => (statusEl.textContent = "Error: " + e.message));
      window.addEventListener("chart-ready", () => {
        chartReady = true;
        refreshAll();
      });
      setTimeout(() => {
        if (!chartReady) refreshAll();
      }, 1500);
    </script>
  </body>
</html>
