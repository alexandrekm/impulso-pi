name: PR Agent Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: impulso-pi-runners
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run pr agent on every pull request, respond to user comments
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PR Agent
        run: python -m pip install --disable-pip-version-check pr-agent

      - name: Run PR Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_BASE: https://litellm.lab.alexkm.me/v1
          OPENAI_KEY: ${{ secrets.LITELLM_API_KEY }}
          OPENAI__API_BASE: https://litellm.lab.alexkm.me/v1
          OPENAI__KEY: ${{ secrets.LITELLM_API_KEY }}
          PR_AGENT__CONFIG__MODEL: openai/pr-agent
          PR_AGENT__CONFIG__MODEL_TURBO: openai/pr-agent
          PR_AGENT__CONFIG__CUSTOM_MODEL_MAX_TOKENS: "131072"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "true"
          GITHUB_ACTION_CONFIG__PR_ACTIONS: '["opened", "reopened", "ready_for_review", "synchronize"]'
        run: |
          set -o pipefail
          python -m pr_agent.servers.github_action_runner 2>&1 | tee /tmp/pr-agent.log
          ! grep -Eq 'Failed to generate (prediction|code suggestions)|Error during OpenAI inference' /tmp/pr-agent.log
