name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: impulso-pi-runners
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run check:json
      - run: npm test

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck install.sh

      - name: install.sh smoke test
        run: |
          set -e
          TEST_AGENT_DIR="$(mktemp -d)"
          # Stub out the `pi` CLI so the smoke test doesn't need network
          # access or a real pi installation to exercise the file-sync logic.
          STUB_BIN="$(mktemp -d)"
          cat > "$STUB_BIN/pi" <<'EOF'
          #!/usr/bin/env bash
          echo "stub pi: $*"
          exit 0
          EOF
          chmod +x "$STUB_BIN/pi"
          # --base syncs ALL resources into the raw agent dir (no profile/ppi
          # needed), exercising the same file-sync + npm-manifest logic.
          PATH="$STUB_BIN:$PATH" PI_AGENT_DIR="$TEST_AGENT_DIR" ./install.sh install --yes --base
          # Second run must be a no-op fast-forward (nothing changed).
          PATH="$STUB_BIN:$PATH" PI_AGENT_DIR="$TEST_AGENT_DIR" ./install.sh install --yes --base | tee /tmp/second-run.log
          if grep -Eq '\[(new|updated|pkg new)\]' /tmp/second-run.log; then
            echo "install.sh is not idempotent: second run made changes" >&2
            exit 1
          fi
          PATH="$STUB_BIN:$PATH" PI_AGENT_DIR="$TEST_AGENT_DIR" ./install.sh status --base
          # Every non-npm resource must have landed at its resolved dest
          # (collision-aware: on --base, shadowed variants don't land). Use
          # `test -e` (not -f): skill resources land as directories.
          node --input-type=module -e '
            import { loadProfiles, classify, isPackageKind, relDestPath, resolveFileKeys } from "./scripts/profiles.mjs";
            const p = loadProfiles("profiles.jsonc");
            const keys = resolveFileKeys(Object.keys(p.resources).filter((k) => !isPackageKind(classify(k))), p.resources);
            for (const k of keys) console.log(relDestPath(k, p.resources[k]));
          ' | while read -r dest; do
            test -e "$TEST_AGENT_DIR/$dest" || { echo "missing: $dest" >&2; exit 1; }
          done
